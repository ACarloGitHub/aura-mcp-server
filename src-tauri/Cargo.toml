[package]
name = "auramcp-server"
version = "3.4.2"
description = "AuraMCP Server launcher"
authors = ["ACarloGitHub"]
license = "MIT"
repository = "https://github.com/ACarloGitHub/aura-mcp-server"
edition = "2021"
rust-version = "1.77"

[lib]
name = "auramcp_server_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
