name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  LLAMACPP_PINNED_VERSION: "b9680"
  NOMIC_GGUF_URL: "https://huggingface.co/nomic-ai/nomic-embed-text-v2-moe-GGUF/resolve/main/nomic-embed-text-v2-moe.Q8_0.gguf"
  NOMIC_GGUF_SHA256: "6E7A7E594A26985523C18383ABA4AAD39FE6E14F08FFC6AB5B554E1CCDC3CFF"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ""
            artifact: windows-msi
            llama_asset: "llama-b${LLAMACPP_PINNED_VERSION}-bin-win-cpu-x64.zip"
            llama_dir: "vendor/llama.cpp/windows"
            ext: ".exe"
          - os: macos-latest
            args: "--target universal-apple-darwin"
            artifact: macos-dmg
            llama_asset: "llama-b${LLAMACPP_PINNED_VERSION}-bin-macos-universal.zip"
            llama_dir: "vendor/llama.cpp/macos"
            ext: ""
          - os: ubuntu-latest
            args: ""
            artifact: linux-deb
            llama_asset: "llama-b${LLAMACPP_PINNED_VERSION}-bin-ubuntu-x64-cpu.tar.gz"
            llama_dir: "vendor/llama.cpp/linux"
            ext: ""

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxml2-utils \
            file \
            wget

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install npm dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Download llama.cpp + nomic GGUF
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          LLAMACPP_ASSET: ${{ matrix.llama_asset }}
          LLAMACPP_DIR: ${{ matrix.llama_dir }}
          LLAMA_EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          mkdir -p "${LLAMACPP_DIR}" embeddings
          echo "Downloading ${LLAMACPP_ASSET}"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          curl -fsSL -o "${TMP}/llama.blob" \
            "https://github.com/ggml-org/llama.cpp/releases/download/${LLAMACPP_PINNED_VERSION}/${LLAMACPP_ASSET}"
          case "${LLAMACPP_ASSET}" in
            *.zip) (cd "${TMP}" && unzip -q llama.blob) ;;
            *.tar.gz) (cd "${TMP}" && tar -xzf llama.blob) ;;
          esac
          BUILD_DIR="$(find "${TMP}" -type d -name 'build' | head -n 1 || true)"
          if [[ -z "${BUILD_DIR}" ]]; then
            BUILD_DIR="$(find "${TMP}" -type d -name 'bin' | head -n 1 || true)"
          fi
          cp -R "${BUILD_DIR}/." "${LLAMACPP_DIR}/"
          chmod +x "${LLAMACPP_DIR}/llama-server${LLAMA_EXT}" || true
          echo "llama.cpp staged at ${LLAMACPP_DIR}"
          echo "Downloading nomic GGUF"
          curl -fsSL -o "embeddings/nomic-embed-text-v2-moe.Q8_0.gguf" "${NOMIC_GGUF_URL}"
          ACTUAL="$(sha256sum embeddings/nomic-embed-text-v2-moe.Q8_0.gguf | awk '{print $1}') | tr 'a-z' 'A-Z'"
          EXPECTED="$(echo ${NOMIC_GGUF_SHA256} | tr 'a-z' 'A-Z')"
          echo "expected sha256: ${EXPECTED}"
          echo "actual   sha256: ${ACTUAL}"
          if [[ "${ACTUAL}" != "${EXPECTED}" ]]; then
            echo "nomic GGUF sha256 mismatch; refusing to proceed"
            exit 1
          fi

      - name: Build application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "AuraMCP ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auramcp-server-${{ matrix.artifact }}
          path: |
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*-setup.exe
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
            src-tauri/target/**/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release with all artifacts
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f -print
          echo "=== File sizes ==="
          find artifacts -type f -exec ls -lh {} \;

      - name: Generate changelog from Conventional Commits
        id: changelog
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const workspace = process.env.GITHUB_WORKSPACE || process.cwd();
            try {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const currentTag = context.ref.replace(/^refs\/tags\//, '');
              const { data: tags } = await github.rest.repos.listTags({ owner, repo, per_page: 10 });
              const stableTags = tags.map(t => t.name)
                .filter(n => /^v\d+\.\d+\.\d+$/.test(n))
                .filter(n => n !== currentTag)
                .sort((a, b) => b.localeCompare(a, undefined, { numeric: true }));
              const previousTag = stableTags[0] || null;

              let commits = [];
              if (previousTag) {
                const { data } = await github.rest.repos.compareCommits({
                  owner, repo, base: previousTag, head: currentTag,
                });
                commits = data.commits;
              } else {
                const { data } = await github.rest.repos.listCommits({ owner, repo, per_page: 50 });
                commits = data;
              }

              const whatsnew = [], improvements = [], breaking = [];
              for (const c of commits) {
                const msg = c.commit.message.split('\n')[0];
                if (/^[a-zA-Z0-9_-]+!:/.test(msg) || /BREAKING CHANGE:/i.test(c.commit.message)) {
                  breaking.push(msg);
                } else if (/^(feat|fix)(\([^)]+\))?!?:/i.test(msg)) {
                  whatsnew.push(msg);
                } else if (/^(refactor|perf|docs|chore)(\([^)]+\))?!?:/i.test(msg)) {
                  improvements.push(msg);
                }
              }

              const fmt = (arr) => arr.length
                ? arr.map(m => '- ' + m).join('\n')
                : '_No changes in this category — see commits on GitHub._';

              const sections = [
                "## What's new",
                fmt(whatsnew),
                "## Improvements",
                fmt(improvements),
              ];
              if (breaking.length > 0) {
                sections.push("## \u26A0\uFE0F Breaking changes");
                sections.push(fmt(breaking));
              }
              sections.push("## Notes");
              sections.push('- **Prerequisites**: Node.js 18+ must be installed on the host system. The launcher shells out to `node dist/index.js`.');
              sections.push('- **What is bundled**: this installer contains the `node`-equivalent MCP server (TypeScript compiled to JS), plus a vendored `llama.cpp` runtime and the `nomic-embed-text-v2-moe.Q8_0` GGUF for the optional RAG tool. The first launch may extract ~600 MB into your platform-specific data dir; further launches are instant.');
              sections.push('- **Workspace**: the launcher sets `AGENT_WORKSPACE` to `<install-dir>/Workspace`. Put your session memory, wiki pages, and RAG collections there.');
              sections.push('- **Hosts**: configure AnythingLLM or LM Studio to point at the `auramcp-server` (Windows) or `auramcp-server` (POSIX) launcher inside the install bin dir.');
              sections.push('- **No code signing**: AuraMCP is open source (MIT) but not yet code-signed. You may see a SmartScreen warning on Windows or Gatekeeper block on macOS.');

              const body = sections.join('\n\n');
              const bodyPath = path.join(workspace, 'release_body.md');
              fs.writeFileSync(bodyPath, body, 'utf8');
              core.setOutput('body_path', bodyPath);
            } catch (err) {
              core.setFailed(`Generate changelog failed: ${err.message}`);
            }

      - name: Sync release body and tag
        id: sync
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const workspace = process.env.GITHUB_WORKSPACE || process.cwd();
            const bodyPath = path.join(workspace, 'release_body.md');
            const currentTag = context.ref.replace(/^refs\/tags\//, '');

            try {
              if (!fs.existsSync(bodyPath)) {
                console.log(`[sync] no changelog at ${bodyPath}, skipping`);
                return;
              }
              const body = fs.readFileSync(bodyPath, 'utf8');

              const { data: releases } = await github.rest.repos.listReleases({
                owner: context.repo.owner, repo: context.repo.repo, per_page: 20,
              });
              const target = releases.find(r =>
                r.tag_name === currentTag || r.target_commitish === context.sha
              );

              if (target) {
                console.log(`[sync] deleting pre-existing release id=${target.id} tag=${target.tag_name}`);
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner, repo: context.repo.repo, release_id: target.id,
                });
              }

              const { data: created } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: currentTag,
                name: `AuraMCP ${currentTag}`,
                body,
                draft: true,
                prerelease: false,
                target_commitish: context.sha,
              });
              console.log(`[sync] created release id=${created.id} url=${created.html_url}`);
              core.setOutput('release_id', String(created.id));
            } catch (err) {
              core.setFailed(`Sync release body failed: ${err.message}`);
            }

      - name: Attach all artifacts
        uses: actions/github-script@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_RELEASE_ID: ${{ steps.sync.outputs.release_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const releaseId = process.env.SYNC_RELEASE_ID;
            if (!releaseId) {
              core.setFailed('SYNC_RELEASE_ID not set');
              return;
            }
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workspace = process.env.GITHUB_WORKSPACE || process.cwd();
            const artifactsDir = path.join(workspace, 'artifacts');
            const allFiles = [];
            function walk(dir) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                const p = path.join(dir, entry.name);
                if (entry.isDirectory()) walk(p);
                else allFiles.push(p);
              }
            }
            walk(artifactsDir);
            console.log(`[upload] found ${allFiles.length} candidate files`);
            const mimeMap = {
              '.msi': 'application/x-msi',
              '.exe': 'application/x-msdownload',
              '.dmg': 'application/apple-diskimage',
              '.tar.gz': 'application/gzip',
              '.deb': 'application/x-deb',
              '.rpm': 'application/x-rpm',
              '.AppImage': 'application/x-executable',
            };
            for (const file of allFiles) {
              const base = path.basename(file);
              let ct = 'application/octet-stream';
              for (const k of Object.keys(mimeMap)) {
                if (base.endsWith(k)) { ct = mimeMap[k]; break; }
              }
              const data = fs.readFileSync(file);
              const url = `https://uploads.github.com/repos/${owner}/${repo}/releases/${releaseId}/assets?name=${encodeURIComponent(base)}`;
              const res = await fetch(url, {
                method: 'POST',
                headers: {
                  'Authorization': `token ${process.env.GITHUB_TOKEN}`,
                  'Content-Type': ct,
                  'Accept': 'application/vnd.github+json',
                  'User-Agent': 'AuraMCP-Release',
                },
                body: data,
              });
              if (!res.ok) {
                const t = await res.text();
                core.setFailed(`upload ${base} failed: ${res.status} ${t}`);
                return;
              }
              console.log(`[upload] uploaded ${base} status=${res.status}`);
            }
