name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      - name: Compile TypeScript
        run: npm run build
      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AuraMCP ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ''
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auramcp-windows
          path: |
            src-tauri/target/**/bundle/msi/*.msi
            src-tauri/target/**/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7

  build-macos:
    name: Build macOS installer
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      - name: Compile TypeScript
        run: npm run build
      - name: Build Tauri (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AuraMCP ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ''
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auramcp-macos
          path: |
            src-tauri/target/**/bundle/dmg/*.dmg
            src-tauri/target/**/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 7

  build-linux:
    name: Build Linux installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxml2-utils \
            file \
            wget
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      - name: Compile TypeScript
        run: npm run build
      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'AuraMCP ${{ github.ref_name }}'
          releaseDraft: true
          prerelease: false
          args: ''
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: auramcp-linux
          path: |
            src-tauri/target/**/bundle/deb/*.deb
            src-tauri/target/**/bundle/rpm/*.rpm
            src-tauri/target/**/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
